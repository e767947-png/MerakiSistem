<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes - Meraki SISTEM</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    .resumen-totales {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin: 20px 0;
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
    }
    .resumen-totales .item {
      text-align: center;
    }
    .resumen-totales .label {
      font-size: 14px;
      color: #6c7a8a;
    }
    .resumen-totales .value {
      font-size: 24px;
      font-weight: bold;
    }
    .value.positivo { color: #28a745; }
    .value.negativo { color: #dc3545; }
    .value.neutro { color: #6c7a8a; }
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <button class="menu-toggle" id="menuToggle">☰</button>

  <aside class="sidebar" id="sidebar">
    <div class="logo">☕ Meraki SISTEM</div>
    <nav>
      <a href="/">📊 Dashboard</a>
      <a href="/ventas">🛒 Ventas</a>
      <a href="/inventario">📦 Inventario</a>
      <a href="/caja">💰 Caja</a>
      <a href="/gastos">💸 Gastos</a>
      <a href="/reportes" class="active">📈 Reportes</a>
      <a href="#" class="logout-link" id="logoutBtn">🚪 Cerrar Sesión</a>
    </nav>
  </aside>

  <main class="main">
    <h1>📈 Reporte de Ventas y Gastos</h1>
    <div class="form-row">
      <div class="form-group">
        <label>Fecha inicio</label>
        <input type="date" id="fechaInicio">
      </div>
      <div class="form-group">
        <label>Fecha fin</label>
        <input type="date" id="fechaFin">
      </div>
      <div class="form-group">
        <label>&nbsp;</label>
        <button class="btn" id="generarReporteBtn">Generar</button>
        <button class="btn" id="exportarExcelBtn" style="background:#28a745; color:white;">📥 Exportar Excel</button>
      </div>
    </div>

    <!-- Resumen de totales -->
    <div id="resumenTotales" class="resumen-totales" style="display:none;">
      <div class="item">
        <div class="label">💵 Total Ventas</div>
        <div class="value" id="totalVentas">Q0.00</div>
      </div>
      <div class="item">
        <div class="label">💸 Total Gastos</div>
        <div class="value" id="totalGastos">Q0.00</div>
      </div>
      <div class="item">
        <div class="label">📊 Ganancia Neta</div>
        <div class="value" id="gananciaNeta">Q0.00</div>
      </div>
      <div class="item">
        <div class="label">📅 Días</div>
        <div class="value" id="totalDias">0</div>
      </div>
    </div>

    <!-- Tabla de detalle -->
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Día</th>
            <th>Ventas (Q)</th>
            <th>Gastos (Q)</th>
            <th>Ganancia Neta (Q)</th>
          </tr>
        </thead>
        <tbody id="tablaReporte">
          <tr><td colspan="4">Selecciona un rango de fechas</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    let datosReporte = [];

    // ---------- TOGGLE MENÚ ----------
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const menuToggle = document.getElementById('menuToggle');

    function toggleMenu() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }
    menuToggle.addEventListener('click', toggleMenu);
    overlay.addEventListener('click', toggleMenu);

    document.querySelectorAll('.sidebar nav a').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 768) {
          sidebar.classList.remove('open');
          overlay.classList.remove('active');
        }
      });
    });

    // ---------- LOGOUT ----------
    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      if (confirm('¿Cerrar sesión?')) {
        await fetch('/api/logout', { credentials: 'include' });
        window.location.href = '/login';
      }
    });

    // ---------- GENERAR REPORTE ----------
    document.getElementById('generarReporteBtn').addEventListener('click', () => {
      const inicio = document.getElementById('fechaInicio').value;
      const fin = document.getElementById('fechaFin').value;
      if (!inicio || !fin) return alert('Selecciona ambas fechas');

      fetch(`/api/reportes/resumen?inicio=${inicio}&fin=${fin}`, { credentials: 'include' })
        .then(res => res.json())
        .then(data => {
          if (data.error) return alert('Error: ' + data.error);
          datosReporte = data.detalle || [];

          // Mostrar resumen de totales
          document.getElementById('resumenTotales').style.display = 'grid';
          document.getElementById('totalVentas').textContent = 'Q' + data.totalVentas.toFixed(2);
          document.getElementById('totalGastos').textContent = 'Q' + data.totalGastos.toFixed(2);

          const ganancia = data.gananciaNeta;
          const gananciaElement = document.getElementById('gananciaNeta');
          gananciaElement.textContent = 'Q' + ganancia.toFixed(2);
          gananciaElement.className = 'value' + (ganancia > 0 ? ' positivo' : ganancia < 0 ? ' negativo' : ' neutro');

          document.getElementById('totalDias').textContent = data.dias || 0;

          // Llenar tabla
          const tbody = document.getElementById('tablaReporte');
          if (datosReporte.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4">No hay datos en este período</td></tr>';
            return;
          }
          tbody.innerHTML = datosReporte.map(d => `
            <tr>
              <td>${d.dia}</td>
              <td>Q${d.ventas.toFixed(2)}</td>
              <td>Q${d.gastos.toFixed(2)}</td>
              <td style="color: ${d.ganancia >= 0 ? '#28a745' : '#dc3545'}; font-weight: bold;">
                Q${d.ganancia.toFixed(2)}
              </td>
            </tr>
          `).join('');
        })
        .catch(err => alert('Error: ' + err.message));
    });

    // ---------- EXPORTAR EXCEL ----------
    document.getElementById('exportarExcelBtn').addEventListener('click', () => {
      if (datosReporte.length === 0) return alert('Primero genera un reporte');
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(datosReporte.map(d => ({
        'Fecha': d.dia,
        'Ventas (Q)': d.ventas.toFixed(2),
        'Gastos (Q)': d.gastos.toFixed(2),
        'Ganancia Neta (Q)': d.ganancia.toFixed(2)
      })));

      // Agregar fila de totales
      const totalVentas = datosReporte.reduce((s, d) => s + d.ventas, 0);
      const totalGastos = datosReporte.reduce((s, d) => s + d.gastos, 0);
      const gananciaNeta = totalVentas - totalGastos;

      XLSX.utils.sheet_add_aoa(ws, [
        [],
        ['TOTALES', totalVentas.toFixed(2), totalGastos.toFixed(2), gananciaNeta.toFixed(2)]
      ], { origin: -1 });

      XLSX.utils.book_append_sheet(wb, ws, 'Reporte');
      XLSX.writeFile(wb, 'reporte_ventas_gastos.xlsx');
    });

    // ---------- ESTABLECER FECHAS POR DEFECTO ----------
    const hoy = new Date();
    const primerDia = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    document.getElementById('fechaInicio').value = primerDia.toISOString().slice(0,10);
    document.getElementById('fechaFin').value = hoy.toISOString().slice(0,10);
  </script>
</body>
</html>
